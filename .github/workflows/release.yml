name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            race: true
            extension: .tar.gz
            macosx_deployment_target: "13.0"
          - runner: macos-15
            goos: darwin
            goarch: arm64
            race: true
            extension: .tar.gz
            macosx_deployment_target: "13.0"
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            race: true
            extension: .tar.gz
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            race: true
            extension: .tar.gz
          - runner: windows-2025
            goos: windows
            goarch: amd64
            race: true
            extension: .zip
            cc: zig cc -target x86_64-windows-gnu
            cxx: zig c++ -target x86_64-windows-gnu
            cgo_ldflags: -Lbuild/windows-compat -lsynchronization
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            race: false
            extension: .zip
            cc: zig cc -target aarch64-windows-gnu
            cxx: zig c++ -target aarch64-windows-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
      ARIADNE_RUN_E2E: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Use x64 Zig on Windows ARM64
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0.zip"
          $directory = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0"
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") {
            throw "unexpected Zig archive checksum: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build libghostty-vt
        run: go run ./tools/build-libghostty-vt -target ${{ matrix.goos }}-${{ matrix.goarch }}
      - name: Prepare Windows race import library
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-compat | Out-Null
          zig dlltool -m i386:x86-64 -d tools/windows/synchronization.def -l build/windows-compat/libsynchronization.a
      - name: Test with race detector
        if: matrix.race
        run: go test -race -shuffle=on ./...
      - name: Test
        if: ${{ !matrix.race }}
        run: go test -shuffle=on ./...
      - name: Vet
        run: go vet ./...
      - name: Build release executable
        shell: bash
        run: |
          set -euo pipefail
          binary="build/release/ariadne"
          if [[ "${{ matrix.goos }}" == windows ]]; then binary+=".exe"; fi
          mkdir -p build/release
          build_date="$(git show -s --format=%cI HEAD)"
          go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/aruzen/ariadne/internal/version.Version=${GITHUB_REF_NAME} -X github.com/aruzen/ariadne/internal/version.Commit=${GITHUB_SHA} -X github.com/aruzen/ariadne/internal/version.Date=${build_date}" \
            -o "$binary" ./cmd/ariadne
          "$binary" --version
      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          binary="build/release/ariadne"
          if [[ "${{ matrix.goos }}" == windows ]]; then binary+=".exe"; fi
          archive="dist/ariadne_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.extension }}"
          go run ./tools/package-release \
            -root . -binary "$binary" -output "$archive" \
            -version "$GITHUB_REF_NAME" -os "${{ matrix.goos }}" -arch "${{ matrix.goarch }}"
      - name: Attest archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ariadne-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ariadne-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ariadne_* | LC_ALL=C sort > SHA256SUMS
      - name: Attest checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=("$GITHUB_REF_NAME" dist/* --verify-tag --title "Ariadne $GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then arguments+=(--prerelease); fi
          gh release create "${arguments[@]}"
