name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: darwin-amd64
            race: true
            macosx_deployment_target: "13.0"
          - runner: macos-15
            target: darwin-arm64
            race: true
            macosx_deployment_target: "13.0"
          - runner: ubuntu-22.04
            target: linux-amd64
            race: true
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            race: true
          - runner: windows-2025
            target: windows-amd64
            race: true
          - runner: windows-11-arm
            target: windows-arm64
            race: false
            cc: zig cc
            cxx: zig c++
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build libghostty-vt
        run: go run ./tools/build-libghostty-vt -target ${{ matrix.target }}
      - name: Race tests
        if: matrix.race
        run: go test -race -shuffle=on ./...
      - name: Tests
        if: ${{ !matrix.race }}
        run: go test -shuffle=on ./...
      - name: Vet
        run: go vet ./...
      - name: Real daemon and PTY E2E
        if: matrix.race
        env:
          ARIADNE_RUN_E2E: "1"
        run: go test -race -count=1 -v ./integration
      - name: Real daemon and PTY E2E
        if: ${{ !matrix.race }}
        env:
          ARIADNE_RUN_E2E: "1"
        run: go test -count=1 -v ./integration
