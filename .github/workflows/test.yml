name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests
        run: go test -race -shuffle=on ./...
      - name: Vet
        run: go vet ./...
      - name: Real daemon and PTY E2E
        env:
          ARIADNE_RUN_E2E: "1"
        run: go test -race -count=1 -v ./integration
