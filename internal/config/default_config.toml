# Ariadne configuration
#
# All options are optional. Uncomment only values you want to override so that
# new built-in defaults can take effect after an upgrade.

# detach_key = "ctrl-a d"

[commands]
# Commands are argv arrays and are executed directly, without a shell.
# shell = ["/bin/zsh", "-l"]
# editor = ["nvim"]
# Windows examples:
# shell = ["pwsh.exe", "-NoLogo"]
# editor = ["notepad.exe"] # Must wait until editing completes; use the editor's wait flag if required.

[tui]
# pane_frame = "full" # "full", "split", or "none"
# pane_title = "auto" # "auto": manual name > OSC 0/2 > command; "terminal": OSC first; "pane": ignore OSC
# mouse = true
# min_pane_width = 2  # Content cells, excluding chrome/separators
# min_pane_height = 1

[tui.cwd]
# Widget cwd precedence: widget > provider/type > pane kind > defaults.
# Sources: "pane", "startup", or an absolute directory.
# terminal = "pane" # Local OSC 7 cwd, falling back to LaunchSpec.CWD
# tool = "startup"
# [tui.cwd.kinds]
# terminal = "pane"
# tool = "startup"
# [tui.cwd.tools]
# "ariadne/diagnostics" = "startup"
# OSC 7 hooks are opt-in; Ariadne never changes your shell configuration.
# Bash PROMPT_COMMAND example (preserve any existing hooks):
# printf '\033]7;file://%s%s\033\\' "$HOSTNAME" "$PWD"
# Percent-encode spaces and non-ASCII paths in a production hook.

[tui.status]
# Builtins: brand, workspace, window, pane, attention, state, clock, cwd.
# left = ["brand", "workspace", "pane"]
# right = ["attention", "state", "clock"]
# Prompt/confirmation remain visible even if both lists are empty.
# [tui.status.widgets.clock]
# format = " {value} "
# style = "status" # Any semantic theme token
# [tui.status.widgets.git]
# command = ["git", "branch", "--show-current"] # Direct argv; no implicit shell
# format = " {output} " # Also: {workspace}, {window}, {pane}, {title}, {cwd}, {state}
# {title} uses tui.pane_title; {pane_title} is the manual name; {terminal_title} is OSC 0/2.
# style = "accent"
# cwd = "pane"
# interval_ms = 5000
# timeout_ms = 1000
# max_bytes = 4096 # stdout; stripped control sequences, one line
# External widgets: one process/widget, up to four total; children are cleaned up.

