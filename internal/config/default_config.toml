# vertical = "│"
# top_left = "┌"
# top_right = "┐"
# bottom_left = "└"
# bottom_right = "┘"
# cross = "┼"
# left_join = "├"
# right_join = "┤"
# top_join = "┬"
# bottom_join = "┴"

[terminal]
# successful_exit = "retain" # "retain" or "close"
# Set both history limits to 0 to disable history retention.
# history_bytes = 16777216
# max_total_history_bytes = 536870912
# read_buffer_bytes = 32768
# attachment_queue_bytes = 4194304
# observer_queue_bytes = 4194304

[clipboard]
# read = "ask"  # "deny", "ask", or "allow"
# write = "ask" # "deny", "ask", or "allow"
# max_text_bytes = 1048576
# command_timeout_ms = 2000

[transport]
# max_frame_bytes = 4194304
# write_queue_frames = 64
# outbound_queue_bytes = 16777216
# outbound_queue_frames = 4096
# per_stream_queue_bytes = 1048576
# per_stream_queue_frames = 256

[attention]
# max_entries = 1024
# marker_bytes = 8192
# plugin_queue_bytes = 1048576

[keybindings.normal]
# A value is one or more command-prompt commands separated by semicolons.
# An empty value disables a built-in binding.
# "ctrl-a h" = "focus left"
# "ctrl-a g" = "focus left; zoom on"
# "ctrl-a x" = ""

[keybindings.copy]
# Mode-local actions, optionally separated by semicolons:
# cancel, left, down, up, right, half-up/down, page-up/down, top, bottom,
# select, copy, search, search-next, search-previous.
# "space" = "select"
# "enter" = "copy"
# "v" = "select"

[keybindings.prompt]
# Actions: accept, cancel, backspace, complete, history-next/previous,
# clear, delete-word. Ordinary committed UTF-8 input is inserted as text.
# "ctrl-g" = "cancel"
# "up" = "history-previous"
# Escape versus escape-prefixed terminal keys uses a 50ms timeout.
# Confirmation keys are fixed (y=yes, n/Escape/Enter=no).
# Legacy flat [keybindings] entries must migrate to [keybindings.normal].

[plugins]
# Trusted external plugins run in separate processes; this is not an OS sandbox.
# Install/enable/grants are managed by `ariadne plugin`, not by this config.
# message_bytes = 8388608
# control_queue = 64
# control_bytes = 16777216
# pty_queue_bytes = 1048576
# initialize_ms = 5000
# api_ms = 2000 # Native callbacks must return within this deadline too.
# render_ms = 1000 # ToolPane and plugin widgets
# command_ms = 30000 # Excludes host dialogue wait time
# interaction_ms = 900000
# shutdown_ms = 2000
# Add "example-process/input-count" to tui.status.left/right, or use an alias:
# [tui.status.widgets.plugin_inputs]
# plugin = "example-process/input-count"
# format = " {output} "
# interval_ms = 5000
# timeout_ms = 1000
